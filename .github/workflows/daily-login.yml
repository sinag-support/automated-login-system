name: Run Daily Login

on:
  schedule:
    - cron: '0 22 * * 1-6'   # 6 AM Manila
    - cron: '0 5 * * 1-6'    # 1 PM Manila
  workflow_dispatch:
    inputs:
      day:
        description: 'Day to process (Monday, Tuesday, etc.)'
        required: true
        type: string

jobs:
  automation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Set timezone to Manila
        run: echo "TZ=Asia/Manila" >> $GITHUB_ENV

      - name: Set target day for scheduled run
        if: github.event_name == 'schedule'
        run: echo "TARGET_DAY=$(date +'%A')" >> $GITHUB_ENV

      - name: Run Automation
        run: npm run start
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TARGET_DAY: ${{ env.TARGET_DAY || github.event.inputs.day }}
          
